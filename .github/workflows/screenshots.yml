name: Update screenshots

# Takes the pictures of the settings page, light and dark (store-assets/screenshots/,
# bun run screenshots), and commits the ones that changed. Run it after a change to the look.
on:
  workflow_dispatch:

jobs:
  screenshots:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@v1
    with:
      # The Playwright image has Node but no unzip or jq: the npm package brings Bun, in the
      # version of packageManager (as setup-bun takes it in check_build.yml), read in an assignment
      # of its own so that a failure stops the step instead of installing npm's latest Bun
      install: |
        version=$(node -p "require('./package.json').packageManager.split('@')[1]")
        npm install --global "bun@$version"
        bun install --frozen-lockfile
      lockfile: bun.lock
      command: bun run screenshots
      paths: store-assets/screenshots
    permissions:
      contents: write
